name: hublee
description: "Quran and Hadith reader app"
publish_to: 'none'
version: 1.0.0+1

environment:
  # Floor is set by the strictest dependency (go_router requires ^3.10.0).
  # Declaring anything lower is a promise the dependency set cannot keep.
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  go_router: ^17.4.0
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2

  # Used by build tools in tools/ only (not at runtime)
  dio: ^5.11.0
  args: ^2.6.0
  path: ^1.9.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/quran/KFGQPCQuranMushaf_smart_v8.json
    - assets/quran/chapters.min.json
    - assets/quran/surah_metadata.json
    - assets/quran/surah_translated_names.json
    - assets/quran/surah_arabic_vowelled.json
    - assets/quran/ar/
    - assets/quran/surah_info.json
    - assets/quran/en.clearquran/
    - assets/quran/en.wordbyword/
    - assets/arabic/
    - assets/hadith/manifest.json
    - assets/hadith/collections.json
    - assets/hadith/forties/
    - assets/hadith/other_books/
    - assets/hadith/the_9_books/
    - assets/images/kaaba_makki.png
    - assets/images/masjid_nabawi_madani.png
    - assets/images/HubleeAppLogo.png
    - assets/images/HubleeBackground.png

  fonts:
    # PUA-glyph mushaf font. Renders `aya_text` only — it has no glyphs for
    # standard Arabic Unicode, so styles using it declare an Amiri fallback.
    - family: KFGQPCQuranicFontHafsSmart
      fonts:
        - asset: assets/fonts/KFGQPCQuranicFontHafsSmart_08.ttf
    # Tarteel QUL Surah name font v4 (calligraphic surah names via ligatures surah001–surah114).
    # Download TTF from: https://qul.tarteel.ai/resources/font/457 (Download ttf).
    - family: SurahNameV4
      fonts:
        - asset: assets/fonts/surah-name-v4.ttf
    # Standard-Unicode Arabic faces (SIL OFL 1.1 — see assets/fonts/OFL-*.txt).
    # Bundled rather than fetched at runtime so Arabic never depends on the
    # network or on a platform font. Amiri also backs `kArabicFontFallback`.
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf

# Native splash screen (logo shown at app launch before Flutter loads).
flutter_native_splash:
  image: assets/images/HubleeAppLogo.png
  color: "#0B4D5C"
  color_dark: "#0B4D5C"

# App launcher icon (replaces default Flutter icon on device home screen).
# Adaptive icon: logo fills the space (no padding); background matches if edges show.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/HubleeAppLogo.png
  adaptive_icon_background: "#0B4D5C"
  adaptive_icon_foreground: assets/images/HubleeAppLogo.png
  adaptive_icon_foreground_inset: 0
